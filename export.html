<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ECTS Career Portfolio PDF</title>
    <style>
      @page {
        size: letter;
        margin: 0.75in;
        @bottom-right {
          content: "Page " counter(page) " of " counter(pages);
          color: #66736d;
          font-size: 7px;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        background: #fff;
        color: #101714;
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        font-size: 10.5px;
        line-height: 1.5;
      }
      .portfolio {
        width: 100%;
        max-width: 8.5in;
        margin: 0 auto;
      }
      .cover {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 2.25in;
        gap: 0.32in;
        align-items: center;
        min-height: 8in;
        padding: 0.42in 0.58in 0.42in 0.42in;
        border-bottom: 2px solid #08745c;
        background: #f4faf7;
        break-after: page;
        page-break-after: always;
      }
      .brand {
        color: #08745c;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }
      .intro-label {
        margin-top: 0.48in;
        color: #08745c;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      h1 {
        margin: 0.25in 0 0.1in;
        font-size: 28px;
        line-height: 1.1;
      }
      .subtitle {
        color: #08745c;
        font-size: 14px;
        font-weight: 700;
      }
      .meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 0.25in;
      }
      .meta span {
        display: block;
        color: #66736d;
        font-size: 8px;
        letter-spacing: 0.1em;
      }
      .meta strong {
        display: block;
        margin-top: 3px;
        font-size: 10px;
      }
      .section {
        padding: 0.35in 0;
        border-bottom: 1px solid #d8e3de;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      h2 {
        margin: 0 0 0.18in;
        color: #075b49;
        font-size: 15px;
      }
      h3 {
        margin: 0.14in 0 0.04in;
        font-size: 11px;
      }
      p {
        margin: 0 0 0.12in;
      }
      .skills,
      .interests {
        display: inline-block;
        margin-right: 3px;
        padding: 3px 7px;
        background: #e9f2ee;
        border-radius: 4px;
      }
      .attachment {
        margin-top: 10px;
        padding: 10px;
        border: 1px solid #d8e3de;
      }
      .attachment img,
      .attachment iframe {
        display: block;
        width: 100%;
        max-width: 100%;
        height: auto;
        border: 0;
      }
      .attachment iframe {
        min-height: 4in;
      }
      .document-placeholder {
        padding: 18px;
        border: 1px dashed #a7bcb3;
        background: #f7faf9;
        color: #50615a;
        text-align: center;
      }
      .meta-line {
        display: flex;
        gap: 8px;
        justify-content: space-between;
        margin-top: 3px;
      }
      .footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding-top: 10px;
        border-top: 1px solid #d8e3de;
        color: #66736d;
        font-size: 8px;
        text-align: center;
      }
      .empty {
        color: #66736d;
        font-style: italic;
      }
      .cover-copy {
        min-width: 0;
      }
      .profile-strengths {
        margin-top: 0.24in;
        padding-left: 0.14in;
        border-left: 2px solid #9bc6b4;
        color: #42564e;
      }
      .profile-strengths strong {
        color: #075b49;
      }
      .cover-meta {
        display: flex;
        gap: 32px;
        margin-top: 0.25in;
      }
      .cover-meta span {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .cover-meta small {
        color: #66736d;
        font-size: 8px;
        letter-spacing: 0.1em;
      }
      .cover-meta strong {
        font-size: 10px;
      }
      .profile-photo {
        width: 2.25in;
        height: 3in;
        overflow: hidden;
        border: 1px solid #c9d8d2;
        background: #eef5f2;
      }
      .profile-photo img,
      .profile-photo .attachment-preview {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .attachment-card {
        display: grid;
        grid-template-columns: minmax(0, 4in) 1fr;
        gap: 10px;
        align-items: center;
        padding: 8px;
        border: 1px solid #d4dfda;
        background: #fff;
        break-inside: auto;
        page-break-inside: auto;
      }
      .attachment-preview {
        height: 4in;
        overflow: hidden;
        background: #fff;
      }
      .attachment-preview img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .attachment-caption strong,
      .attachment-caption span,
      .attachment-caption small {
        display: block;
      }
      .attachment-caption small {
        color: #66736d;
      }
      .attachment-reference {
        color: #65736d;
        font-size: 8px;
        font-style: italic;
      }
      .table-of-contents {
        padding: 0.35in;
        border: 1px solid #d8e3de;
        border-top: 5px solid #08745c;
        background: #fff;
      }
      .contents-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 0.25in;
        padding-bottom: 0.18in;
        border-bottom: 1px solid #d8e3de;
      }
      .contents-heading span,
      .contents-links h3,
      .portfolio-checklist h3 {
        color: #08745c;
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .contents-heading h2 {
        margin: 4px 0 0;
        color: #101714;
        font-size: 19px;
      }
      .contents-heading p {
        max-width: 2.8in;
        margin: 0;
        color: #66736d;
        font-size: 8px;
      }
      .contents-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
        gap: 0.28in;
        padding-top: 0.2in;
      }
      .contents-links h3,
      .portfolio-checklist h3 {
        margin: 0 0 10px;
      }
      .contents-links > div {
        display: grid;
        grid-template-columns: 1fr;
        gap: 7px;
      }
      .table-of-contents a {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        color: #1c5548;
        font-size: 9px;
        text-decoration: none;
      }
      .portfolio-checklist {
        padding: 0.16in;
        border: 1px solid #d8e3de;
        background: #f5f8f6;
      }
      .portfolio-checklist ul {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .checklist-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: baseline;
        gap: 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid #dce7e2;
      }
      .checklist-item:last-child {
        padding-bottom: 0;
        border-bottom: 0;
      }
      .checklist-item a {
        color: #263c34;
        font-size: 8px;
      }
      .checklist-item > span {
        color: #8a5a16;
        font-size: 7px;
        font-weight: 700;
        text-align: right;
      }
      .checklist-item--complete > span {
        color: #08745c;
      }
      .table-of-contents a::after {
        content: target-counter(attr(href), page);
        color: #66736d;
        text-align: right;
      }
      .table-of-contents a:hover {
        color: #08745c;
        text-decoration: underline;
      }
      .export-section {
        padding: 0.3in 0;
        border-bottom: 1px solid #d8e3de;
        break-inside: auto;
        page-break-inside: auto;
      }
      .section-divider {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        border-top: 3px solid #08745c;
        border-bottom: 1px solid #d8e3de;
        color: #66736d;
        font-size: 7px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .section-divider span:last-child {
        color: #08745c;
        text-align: right;
      }
      .export-section > h2 {
        margin-top: 0.14in;
        color: #101714;
        font-size: 19px;
      }
      .portfolio-entry {
        margin-bottom: 0.18in;
        padding: 0.14in 0.16in;
        border-left: 2px solid #9bc6b4;
        background: #f7faf8;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .portfolio-entry:last-child {
        margin-bottom: 0;
      }
      .attachment-card {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .attachment-icon {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 4px;
        background: #e8f2ee;
        color: #08745c;
        font-size: 8px;
        font-weight: 700;
      }
      .attachment-caption .attachment-status {
        color: #50615a;
        font-size: 8px;
      }
      .attachment-link {
        color: #08745c;
        font-size: 8px;
        text-decoration: underline;
      }
      .render-error {
        padding: 1in;
        color: #8c2b2b;
        text-align: center;
      }
      @media print {
        html,
        body {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
        .portfolio {
          max-width: none;
        }
        .export-section--page-start {
          break-before: page;
          page-break-before: always;
        }
        .document-entry + .document-entry {
          break-before: page;
          page-break-before: always;
        }
        .export-section,
        .attachment-card {
          break-inside: auto;
          page-break-inside: auto;
        }
      }
    </style>
  </head>
  <body>
    <main id="portfolio" class="portfolio"></main>
    <div id="status" role="status"></div>
    <script src="./portfolio-quality.js"></script>
    <script type="module" src="./export-final.js"></script>
  </body>
</html>
